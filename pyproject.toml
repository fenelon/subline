[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subline"
version = "0.1.3"
description = "Generate SRT/VTT subtitles from video files using faster-whisper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.0"]
keywords = ["whisper", "subtitles", "srt", "vtt", "transcription"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/fenelon/subline"

[project.scripts]
subline = "subline:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
